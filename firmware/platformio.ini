; =============================================================================
;  ESP32-S3 Passkey  --  FIDO2 / CTAP2.1 / U2F authenticator
;  16 MB QIO flash | 8 MB OPI PSRAM | native USB (HID + CDC composite)
; =============================================================================
[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; --- Module specifics (N16R8) ------------------------------------------------
board_build.mcu                 = esp32s3
board_build.flash_mode          = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 16MB
board_build.partitions          = partitions.csv

; --- CPU / clocks ------------------------------------------------------------
board_build.f_cpu               = 240000000L
board_build.f_flash             = 80000000L

; --- USB ---------------------------------------------------------------------
; ARDUINO_USB_MODE=0 selects the USB-OTG / TinyUSB stack.  Mode 1 would select
; the hardware USB-Serial-JTAG peripheral instead, and then the composite
; device can only expose HID - the CDC management channel would disappear.
; CDC on boot is deliberate: CDC is the management channel and the OTA port.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_LOOP_STACK_SIZE=24576
    -DCORE_DEBUG_LEVEL=0
    -DPK_VERSION_MAJOR=0
    -DPK_VERSION_MINOR=1
    -DPK_VERSION_PATCH=0

monitor_speed = 115200
upload_speed  = 921600
