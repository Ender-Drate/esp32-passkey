; =============================================================================
;  TechXPassKey second board (interlock key holder)
;  ESP32-S3: UART1 RX=GPIO42, TX=GPIO41, onboard WS2812 on GPIO48
;  Main board: GPIO16 (TX) -> 42, GPIO17 (RX) <- 41, GND <-> GND
; =============================================================================
[platformio]
default_envs = esp32-s3-key

[env:esp32-s3-key]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DKEY_RX_PIN=42
    -DKEY_TX_PIN=41
    -DKEY_LED_PIN=48
    -DKEY_BUTTON_PIN=0
    -DCORE_DEBUG_LEVEL=0

monitor_speed = 115200
upload_speed  = 921600
